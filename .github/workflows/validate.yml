name: Quality & Workflow Validation

on:
  push:
    branches: [ main, master, codex/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate n8n Workflow JSON
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "n8n-workflows";
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".json"));
            let totalNodes = 0;
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const data = JSON.parse(fs.readFileSync(fullPath, "utf8"));
              if (!Array.isArray(data.nodes)) {
                throw new Error(`${file} missing nodes array`);
              }
              totalNodes += data.nodes.length;
              console.log(`[PASS] ${file}: valid JSON (${data.nodes.length} nodes)`);
            }
            if (totalNodes !== 87) {
              console.warn(`Warning: Expected 87 nodes across workflows, found ${totalNodes}`);
            }
            console.log(`[PASS] All workflow exports verified. Total nodes: ${totalNodes}`);
          '

      - name: Run Stage 4 Deterministic Rule Tests
        run: |
          node scripts/test-stage-4-validation.js
          echo "[PASS] All stage 4 validation checks passed successfully."

      - name: Verify Credential Hygiene
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const checkDir = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name !== "node_modules" && entry.name !== ".git") checkDir(fullPath);
                } else if (entry.name.endsWith(".json") || entry.name.endsWith(".js") || entry.name.endsWith(".md")) {
                  const content = fs.readFileSync(fullPath, "utf8");
                  if (/sk-[a-zA-Z0-9]{20,}/.test(content) && !content.includes("sk-placeholder") && !content.includes("sk-test")) {
                    throw new Error(`Potential real OpenAI key detected in ${fullPath}`);
                  }
                }
              }
            };
            checkDir(".");
            console.log("[PASS] Zero raw credentials detected.");
          '

      - name: Verify Documentation Style (Banned Em Dash Check)
        run: |
          node -e '
            const fs = require("fs");
            const files = ["README.md", "CASE_STUDY.md"];
            for (const f of files) {
              if (fs.existsSync(f)) {
                const content = fs.readFileSync(f, "utf8");
                if (content.includes("\u2014") || content.includes("\u2013")) {
                  throw new Error(`Banned em dash or en dash detected in ${f}`);
                }
              }
            }
            console.log("[PASS] Em dash style verification clean.");
          '
